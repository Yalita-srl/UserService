version: '3.8'

services:
  # Servicio de la aplicación Django
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn user_service.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles # Monta el volumen para archivos estáticos
    env_file:
      - ./.env
    depends_on:
      - db
    networks:
      - user-network

  # Servicio de la base de datos MySQL
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_ROOT_PASSWORD: '' # Contraseña vacía para el usuario root
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306" # Mapea el puerto del contenedor a un puerto diferente en el host (3307) para evitar conflictos con XAMPP
    networks:
      - user-network

  # Proxy reverso NGINX
  nginx:
    image: nginx:latest
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/usr/share/nginx/html/static # Monta el volumen para archivos estáticos
    depends_on:
      - user-service
    networks:
      - user-network

volumes:
  mysql-data:
  static_volume: # Define el volumen para archivos estáticos

networks:
  user-network:
    driver: bridge
